name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pod_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generated files are up to date
        run: make spec

      - name: Copy passes the never-shame rule
        run: make copylint

      - name: Backend is formatted
        run: |
          unformatted=$(gofmt -l backend tools)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Backend vets
        run: cd backend && go vet ./...

      - name: Backend tests, including Postgres integration
        run: make backend-test

      - name: Android core tests
        run: make android-core-test

  # The iOS build needs macOS and Xcode, and :app needs the Android SDK. Both run on
  # their own runners rather than holding up the checks above.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: PodKit tests
        run: swift test --package-path ios/PodKit

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Assemble and test
        run: cd android && ./gradlew :app:assembleDebug test
