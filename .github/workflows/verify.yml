name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pod_test?sslmode=disable
      # The migration test skips when it cannot create a throwaway database. In CI that
      # skip would silently remove the only check that migrations apply from nothing, so
      # here it is a failure instead.
      POD_REQUIRE_MIGRATION_TEST: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generated files are up to date
        run: make spec

      - name: Copy passes the never-shame rule
        run: make copylint

      # Not a type checker. It catches the narrow class of mistake that comes from
      # writing against generated code by hand, which is the only compiler substitute
      # available on a runner with neither Xcode nor the Android SDK.
      - name: Client code matches the generated models
        run: make clientlint

      - name: Backend is formatted
        run: |
          unformatted=$(gofmt -l backend tools)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Backend vets
        run: cd backend && go vet ./...

      - name: Backend tests, including Postgres integration
        run: make backend-test

      - name: Android core tests
        run: make android-core-test

      - name: The scheduled jobs start and exit cleanly
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          POD_BLOB_ROOT: ${{ runner.temp }}/blobs
        run: |
          cd backend
          go run ./cmd/migrate up
          go run ./cmd/matcher once
          go run ./cmd/weekly once

  # The iOS build needs macOS and Xcode, and :app needs the Android SDK. Both run on
  # their own runners rather than holding up the checks above.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: PodKit tests
        run: swift test --package-path ios/PodKit

      # PodKit alone does not cover the app target, and the app target is where the
      # SwiftUI screens and Info.plist live — including the usage descriptions whose
      # absence terminated the app on proof capture (ADR-025). Nothing but a real build
      # catches that class of problem.
      # Deliberately not piped through xcpretty: a pipe takes the exit code from the
      # formatter, which returns 0 whatever xcodebuild did, so a failed build would pass.
      - name: Build the app target
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -project Pod.xcodeproj -scheme Pod \
            -destination 'platform=iOS Simulator,name=iPhone 16' build

      # The usage descriptions must survive into the built plist, not merely into
      # project.yml. copylint checks the source; this checks the artefact.
      - name: The built app declares its usage descriptions
        run: |
          plist=$(find ~/Library/Developer/Xcode/DerivedData -name Info.plist -path '*Pod.app*' | head -1)
          if [ -z "$plist" ]; then echo "no built Info.plist found"; exit 1; fi
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null \
              || { echo "the built app declares no $key — it will be terminated on proof capture"; exit 1; }
          done

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Assemble and test
        run: cd android && ./gradlew :app:assembleDebug test
