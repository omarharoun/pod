# XcodeGen input. The .xcodeproj is generated and not committed — a project file is a
# merge conflict waiting to happen, and everything it would encode belongs here in the
# open. Run `xcodegen generate` in this directory.
name: Pod
options:
  bundleIdPrefix: app.pod
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PodKit:
    path: PodKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""

targets:
  Pod:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PodKit
        product: PodAPI
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pod
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without these three the app is *terminated* by the OS the instant proof
        # capture is tapped — no exception to catch, no error to show. That is M3's
        # central action, and nothing in the build catches it because the crash is TCC's,
        # not the app's.
        #
        # The text is copy, so content/microcopy.json is the source of truth and
        # tools/copylint fails if these fall out of step with it. A plist cannot resolve
        # a key at runtime, so it is checked rather than resolved.
        NSCameraUsageDescription: "Pod uses the camera for your ten-second proof. It goes to your pod and is deleted at the end of the week."
        NSMicrophoneUsageDescription: "Pod uses the microphone for a ten-second voice note. It goes to your pod and is deleted at the end of the week."
        NSPhotoLibraryUsageDescription: "Pod can use a photo you already have as this week's proof. It goes to your pod and is deleted at the end of the week."
        # Pod has no reason to want background location, contacts or health data
        # (CLAUDE.md §8). If a dependency ever asks, that is an escalation, not a plist
        # edit.
        PodAPIBaseURL: $(POD_API_BASE_URL)
    settings:
      base:
        POD_API_BASE_URL: https://api.pod.app
        PRODUCT_BUNDLE_IDENTIFIER: app.pod.ios
      configs:
        Debug:
          POD_API_BASE_URL: http://localhost:8080
